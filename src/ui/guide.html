<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      user-select: none;
      pointer-events: none;
      font-family: 'JetBrains Mono', Consolas, monospace;
      display: flex;
      flex-direction: column;
    }
    .guide-header {
      height: 24px;
      display: flex;
      align-items: flex-end;
      padding-bottom: 2px;
      flex-shrink: 0;
    }
    .guide-label {
      background: rgba(9, 9, 11, 0.92);
      border: 1px solid #22c55e;
      color: #86efac;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 3px;
      white-space: nowrap;
    }
    .guide-box {
      flex: 1;
      width: 100%;
      border: 2px dashed #22c55e;
      background: transparent;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.35);
    }
  </style>
</head>
<body>
  <div class="guide-header">
    <div class="guide-label" id="guide-label">ÁREA DE CAPTURA DO JOGO [Alt+C para ocultar]</div>
  </div>
  <div class="guide-box"></div>
</body>
</html>
